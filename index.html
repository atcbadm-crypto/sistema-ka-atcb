<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal da Associação - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --bg: #f3f4f6;
            --text: #1f2937;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: var(--primary-dark);
        }
        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .toggle-link a {
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
        }
        .toggle-link a:hover {
            text-decoration: underline;
        }
        #mensagem {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="form-title">Portal do Terapeuta - Acesso</h2>
        
        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="seu@email.com">
        </div>

        <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="********">
        </div>

        <button id="btn-submit" onclick="handleAuth()">Entrar no Sistema</button>

        <div class="toggle-link">
            <span id="toggle-text">Não tem conta?</span> <a onclick="toggleMode()">Cadastre-se</a>
        </div>

        <div id="mensagem"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://noroqelqqecangstocae.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_7fkkmNYJDC5hNd07o_XWmw_7A7eN7nM';
        
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            const title = document.getElementById('form-title');
            const btn = document.getElementById('btn-submit');
            const toggleText = document.getElementById('toggle-text');
            const link = document.querySelector('.toggle-link a');

            if (isLoginMode) {
                title.innerText = 'Portal do Terapeuta - Acesso';
                btn.innerText = 'Entrar no Sistema';
                toggleText.innerText = 'Não tem conta?';
                link.innerText = 'Cadastre-se';
            } else {
                title.innerText = 'Cadastro de Conta';
                btn.innerText = 'Cadastrar Conta';
                toggleText.innerText = 'Já tem uma conta?';
                link.innerText = 'Faça login';
            }
        }

        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const msg = document.getElementById('mensagem');

            if (!email || !senha) {
                msg.style.color = 'red';
                msg.innerText = 'Preencha o e-mail e a senha!';
                return;
            }

            msg.style.color = '#0d9488';
            msg.innerText = isLoginMode ? 'Entrando...' : 'Cadastrando...';

            if (isLoginMode) {
                const { data, error } = await dbClient.auth.signInWithPassword({
                    email: email,
                    password: senha
                });

                if (error) {
                    msg.style.color = 'red';
                    msg.innerText = 'Erro ao entrar: ' + error.message;
                } else {
                    msg.style.color = 'green';
                    msg.innerText = 'Login realizado! Redirecionando...';
                    // Redireciona automaticamente para a nova página de cadastro de dados
                    setTimeout(() => {
                        window.location.href = 'cadastro.html';
                    }, 1000);
                }
            } else {
                const { data, error } = await dbClient.auth.signUp({
                    email: email,
                    password: senha
                });

                if (error) {
                    msg.style.color = 'red';
                    msg.innerText = 'Erro ao cadastrar: ' + error.message;
                } else {
                    msg.style.color = 'green';
                    msg.innerText = 'Conta criada com sucesso! Faça login.';
                }
            }
        }
    </script>
</body>
</html>
